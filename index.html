<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>결혼합니다</title>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="최재우 ❤ 오혜연 결혼합니다" />
  <meta property="og:description" content="2027년 1월 9일 토요일 낮 12시, 그랜드 웨딩홀" />
  <meta property="og:image" content="https://cjw23.github.io/mobile-invitation/assets/images/cover.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">

    <!-- ═══════ 커버 (대표 사진) ═══════ -->
    <section class="cover" id="cover">
      <div class="cover__img" id="coverImg"></div>
      <div class="cover__overlay"></div>
      <div class="cover__hearts" id="coverHearts" aria-hidden="true"></div>
      <h1 class="cover__wording" id="coverWording"></h1>
      <div class="cover__bottom">
        <p class="cover__date" id="coverDate"></p>
        <p class="cover__quote" id="coverQuote"></p>
      </div>
      <div class="cover__scroll" aria-hidden="true">
        <span></span>
      </div>
    </section>

    <!-- ═══════ 인사말 ═══════ -->
    <section class="section greeting reveal" id="greeting">
      <p class="section__eyebrow">INVITATION</p>
      <h2 class="section__title" id="greetingTitle">결혼합니다</h2>
      <div class="divider"><span></span></div>
      <p class="greeting__message" id="greetingMessage"></p>
      <div class="greeting__family" id="greetingFamily"></div>
    </section>

    <!-- ═══════ 달력 / D-day ═══════ -->
    <section class="section calendar reveal" id="calendar">
      <p class="section__eyebrow">THE DAY</p>
      <h2 class="section__title calendar__month" id="calMonthTitle"></h2>
      <div class="divider"><span></span></div>
      <div class="calendar__grid" id="calendarGrid"></div>
      <p class="calendar__date" id="calDateText"></p>
      <p class="calendar__dday" id="ddayText"></p>
    </section>

    <!-- ═══════ 갤러리 ═══════ -->
    <section class="section gallery reveal" id="gallery">
      <p class="section__eyebrow">GALLERY</p>
      <h2 class="section__title">웨딩 갤러리</h2>
      <div class="divider"><span></span></div>
      <div class="gallery__grid" id="galleryGrid"></div>
    </section>

    <!-- ═══════ 오시는 길 (지도) ═══════ -->
    <section class="section location reveal" id="location">
      <p class="section__eyebrow">LOCATION</p>
      <h2 class="section__title">오시는 길</h2>
      <div class="divider"><span></span></div>
      <p class="location__hall" id="hallName"></p>
      <p class="location__addr" id="hallAddress"></p>
      <div class="map" id="map"></div>
      <div class="map__buttons">
        <a href="#" class="map__btn" id="btnKakaoMap" target="_blank" rel="noopener">
          <span class="map__ico map__ico--kakao" aria-hidden="true">
            <svg viewBox="0 0 36 36"><rect width="36" height="36" rx="9" fill="#FEE500"/><path d="M18 9c-4.7 0-8.5 3-8.5 6.7 0 2.4 1.6 4.5 4 5.7-.2.6-.7 2.4-.8 2.8 0 .2.2.4.4.2.3-.2 2.6-1.8 3.6-2.5.4 0 .9.1 1.3.1 4.7 0 8.5-3 8.5-6.7S22.7 9 18 9z" fill="#3C1E1E"/></svg>
          </span>
          <span class="map__btn-label">카카오맵</span>
        </a>
        <a href="#" class="map__btn" id="btnNaverMap" target="_blank" rel="noopener">
          <span class="map__ico map__ico--naver" aria-hidden="true">
            <svg viewBox="0 0 36 36"><rect width="36" height="36" rx="9" fill="#03C75A"/><path d="M20.5 11v7.1L15.4 11H11v14h4.5v-7.1L20.6 25H25V11z" fill="#fff"/></svg>
          </span>
          <span class="map__btn-label">네이버지도</span>
        </a>
        <a href="#" class="map__btn" id="btnTmap" target="_blank" rel="noopener">
          <span class="map__ico map__ico--tmap" aria-hidden="true">
            <svg viewBox="0 0 36 36"><rect width="36" height="36" rx="9" fill="#fff" stroke="#e8e2da"/><path d="M11 12.5h14M18 12.5V25" stroke="#EC1C34" stroke-width="3.2" stroke-linecap="round"/></svg>
          </span>
          <span class="map__btn-label">티맵</span>
        </a>
      </div>
      <div class="directions" id="directions"></div>
    </section>

    <!-- ═══════ 안내 (탭) ═══════ -->
    <section class="section info reveal" id="info">
      <p class="section__eyebrow">INFORMATION</p>
      <h2 class="section__title">웨딩 안내</h2>
      <div class="divider"><span></span></div>
      <div class="tabs">
        <div class="tabs__nav" id="tabsNav"></div>
        <div class="tabs__panels" id="tabsPanels"></div>
      </div>
    </section>

    <!-- ═══════ 마음 전하실 곳 (계좌) ═══════ -->
    <section class="section accounts reveal" id="accounts">
      <p class="section__eyebrow">GIFT</p>
      <h2 class="section__title">마음 전하실 곳</h2>
      <div class="divider"><span></span></div>
      <p class="accounts__note">참석이 어려우신 분들을 위해<br />계좌번호를 기재하였습니다.</p>
      <div class="accordion">
        <button class="accordion__head" data-acc="groom">
          <span>신랑측 계좌번호</span><span class="accordion__arrow">⌄</span>
        </button>
        <div class="accordion__body" id="accGroom"></div>
      </div>
      <div class="accordion">
        <button class="accordion__head" data-acc="bride">
          <span>신부측 계좌번호</span><span class="accordion__arrow">⌄</span>
        </button>
        <div class="accordion__body" id="accBride"></div>
      </div>
    </section>

    <!-- ═══════ 연락하기 ═══════ -->
    <section class="section contact reveal" id="contact">
      <p class="section__eyebrow">CONTACT</p>
      <h2 class="section__title">연락하기</h2>
      <div class="divider"><span></span></div>
      <div class="contact__grid" id="contactGrid"></div>
    </section>

    <!-- ═══════ 공유 ═══════ -->
    <section class="section share reveal" id="share">
      <div class="divider"><span></span></div>
      <p class="share__text">소중한 분들을 초대합니다</p>
      <div class="share__buttons">
        <button class="share__btn" id="btnKakaoShare">카카오톡 공유</button>
        <button class="share__btn share__btn--line" id="btnCopyLink">링크 복사</button>
      </div>
      <p class="footer">Copyright © 2026. Made with ♥</p>
    </section>

  </div>

  <!-- ═══════ 라이트박스 ═══════ -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox__close" id="lbClose" aria-label="닫기">✕</button>
    <button class="lightbox__nav lightbox__nav--prev" id="lbPrev" aria-label="이전">‹</button>
    <img class="lightbox__img" id="lbImg" src="" alt="웨딩 사진" />
    <button class="lightbox__nav lightbox__nav--next" id="lbNext" aria-label="다음">›</button>
    <p class="lightbox__count" id="lbCount"></p>
  </div>

  <!-- ═══════ 배경음악 토글 ═══════ -->
  <button class="bgm-toggle" id="bgmToggle" aria-label="배경음악" hidden>
    <span class="bgm-toggle__icon">♪</span>
  </button>

  <!-- 토스트 -->
  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
